
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>WordWeft — Where Stories Come Alive | Read &amp; Write Immersive Fiction</title>
    <meta name="description" content="WordWeft gives writers superpowers and readers immersive experiences. Mood-shifting atmospheres, hidden spoilers, living characters, and a world-building toolkit — all in one beautiful platform." />
    <meta name="keywords" content="wordweft, stories, reading, writing, fiction, self-publishing, immersive reader, mood themes, spoiler guard, world building" />
    <link rel="canonical" href="https://wordweftstudio.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="WordWeft — Where Stories Come Alive" />
    <meta property="og:description" content="Mood-shifting atmospheres, hidden spoilers, living characters, and a world-building toolkit — all in one beautiful storytelling platform." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wordweftstudio.com/" />
    <meta property="og:site_name" content="WordWeft" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordWeft — Where Stories Come Alive" />
    <meta name="twitter:description" content="Mood-shifting atmospheres, hidden spoilers, living characters, and a world-building toolkit — all in one beautiful storytelling platform." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WordWeft",
      "url": "https://wordweftstudio.com",
      "description": "A next-generation platform for readers and storytellers. Mood-shifting atmospheres, hidden spoilers, living characters, and a world-building toolkit.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://wordweftstudio.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2048279980945962"
     crossorigin="anonymous"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Literata:opsz,wght@7..72,400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Literata', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: '#5D4037',
              accent: '#8D6E63',
              // Light Theme
              background: '#FBF9F6',
              surface: '#FFFFFF',
              'text-rich': '#4E342E',
              'text-body': '#795548',
              // Dark Theme
              'dark-background': '#261F1D',
              'dark-surface': '#3E2723',
              'dark-surface-alt': '#4E342E',
              'dark-text-rich': '#EFEBE9',
              'dark-text-body': '#BCAAA4',
              'dark-border': '#5D4037',
              // Common
              success: '#689F38',
              warning: '#FFA000',
              danger: '#D32F2F',
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '16px',
              '3xl': '20px',
            },
            boxShadow: {
              'soft': '0 4px 12px rgba(0, 0, 0, 0.05)',
              'lifted': '0 10px 25px rgba(0, 0, 0, 0.08)',
              'glow': '0 0 15px rgba(141, 110, 99, 0.3)',
            },
            keyframes: {
              'gradient-shift': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              'ripple': {
                'to': { transform: 'scale(4)', opacity: '0' },
              },
              'slide-in-bottom': {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              'highlight-fade': {
                '0%': { backgroundColor: 'rgba(255, 193, 7, 0.4)' },
                '100%': { backgroundColor: 'transparent' },
              }
            },
            animation: {
              'gradient-shift': 'gradient-shift 10s ease infinite',
              'ripple': 'ripple 0.6s linear',
              'slide-in-bottom': 'slide-in-bottom 0.3s ease-out forwards',
              'highlight': 'highlight-fade 2s ease-out forwards',
            }
          }
        }
      }
    </script>
    <style>
      .bg-animated-gradient {
        background: linear-gradient(-45deg, #5D4037, #795548, #8D6E63, #5D4037);
        background-size: 400% 400%;
      }
      .highlight-animation {
        animation: highlight-fade 2s ease-out forwards;
      }
    </style>

}
</script>
