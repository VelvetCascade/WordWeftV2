
spring.application.name=wordweft-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/wordweft
spring.data.mongodb.auto-index-creation=true

# App Properties
wordweft.app.jwtSecret=WordWeftSecretKeyForJwtSigningMustBeLongEnoughToBeSecureInProductionEnvironmentAndAtLeast256Bits
wordweft.app.jwtExpirationMs=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
