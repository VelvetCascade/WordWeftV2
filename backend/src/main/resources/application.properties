
spring.application.name=wordweft-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# App Properties
wordweft.app.jwtSecret=WordWeftSecretKeyForJwtSigningMustBeLongEnoughToBeSecureInProductionEnvironmentAndAtLeast256Bits
wordweft.app.jwtExpirationMs=86400000
wordweft.app.googleClientId=${GOOGLE_CLIENT_ID}

# JSON Date Format Fix
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
