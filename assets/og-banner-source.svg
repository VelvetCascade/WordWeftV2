<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">WordWeft social preview</title>
  <desc id="description">A cream and brown WordWeft card reading Read, write, share stories.</desc>
  <rect width="1200" height="630" fill="#f7f3ec"/>
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#d8cfc3" stroke-width="2"/>
  <line x1="708" y1="44" x2="708" y2="586" stroke="#d8cfc3" stroke-width="2"/>

  <text x="108" y="126" fill="#765448" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">WORDWEFT STUDIO</text>
  <text x="104" y="245" fill="#352620" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">Read. Write.</text>
  <text x="104" y="335" fill="#352620" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">Share stories.</text>
  <line x1="108" y1="392" x2="604" y2="392" stroke="#765448" stroke-width="4"/>
  <text x="108" y="446" fill="#675d57" font-family="Arial, Helvetica, sans-serif" font-size="24">Stories by independent writers.</text>
  <text x="108" y="532" fill="#765448" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">wordweftstudio.com</text>

  <circle cx="932" cy="275" r="132" fill="#765448"/>
  <circle cx="932" cy="275" r="114" fill="none" stroke="#f7f3ec" stroke-width="2" opacity="0.72"/>
  <text x="932" y="324" fill="#f7f3ec" font-family="Georgia, 'Times New Roman', serif" font-size="154" font-weight="700" text-anchor="middle">W</text>
  <text x="932" y="464" fill="#352620" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">READ • WRITE • PUBLISH</text>
</svg>
