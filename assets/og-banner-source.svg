<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">WordWeft social preview</title>
  <desc id="description">A cream and brown WordWeft card reading Read, write, share stories.</desc>
  <rect width="1200" height="630" fill="#f7f3ec"/>
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#d8cfc3" stroke-width="2"/>

  <text x="600" y="128" fill="#765448" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5" text-anchor="middle">WORDWEFT STUDIO</text>
  <text x="600" y="260" fill="#352620" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" text-anchor="middle">Read. Write.</text>
  <text x="600" y="352" fill="#352620" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" text-anchor="middle">Share stories.</text>
  <line x1="360" y1="405" x2="840" y2="405" stroke="#765448" stroke-width="4"/>
  <text x="600" y="466" fill="#675d57" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle">Stories for every kind of reader and writer.</text>
  <text x="600" y="538" fill="#765448" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">wordweftstudio.com</text>
</svg>
